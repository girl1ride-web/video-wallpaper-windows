name: Build and Release Video Wallpaper

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build one-file EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name VideoWallpaper --collect-all imageio_ffmpeg --collect-all PySide6.QtMultimedia main.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoWallpaper-Windows
          path: dist/VideoWallpaper.exe
          if-no-files-found: error

      - name: Recreate latest release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>$null
          gh release create latest "dist/VideoWallpaper.exe#VideoWallpaper.exe" --title "Video Wallpaper" --notes "Windows x64 production build. Download VideoWallpaper.exe and run it directly. No Python installation required."
